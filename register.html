<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل جديد - أتمتة</title>
  <link rel="stylesheet" href="auth.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-header">
        <h1>📊 أتمتة</h1>
        <p>إنشاء حساب جديد</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label for="email">البريد الإلكتروني:</label>
          <input type="email" id="email" required placeholder="example@email.com">
        </div>

        <div class="form-group">
          <label for="password">كلمة المرور:</label>
          <input type="password" id="password" required placeholder="6 أحرف على الأقل" minlength="6">
        </div>

        <div class="form-group">
          <label for="shop_id">معرف المتجر (Shop ID):</label>
          <input type="number" id="shop_id" required placeholder="مثال: 1">
          <small>احصل عليه من البوت عبر /mystats</small>
        </div>

        <div id="error-msg" class="error-msg hidden"></div>
        <div id="success-msg" class="success-msg hidden"></div>

        <button type="submit" class="btn-primary" id="register-btn">
          ✨ إنشاء الحساب
        </button>
      </form>

      <div class="auth-footer">
        <p>لديك حساب؟ <a href="login.html">تسجيل الدخول</a></p>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
