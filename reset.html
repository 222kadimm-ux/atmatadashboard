<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعادة تعيين كلمة المرور - أتمتة</title>
  <link rel="stylesheet" href="auth.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-header">
        <h1>🔑 أتمتة</h1>
        <p>إعادة تعيين كلمة المرور</p>
      </div>

      <form id="reset-form">
        <div class="form-group">
          <label for="password">كلمة المرور الجديدة:</label>
          <input type="password" id="password" required placeholder="6 أحرف على الأقل" minlength="6">
        </div>

        <div class="form-group">
          <label for="confirm-password">تأكيد كلمة المرور:</label>
          <input type="password" id="confirm-password" required placeholder="أعيدي كتابتها" minlength="6">
        </div>

        <div id="error-msg" class="error-msg hidden"></div>
        <div id="success-msg" class="success-msg hidden"></div>

        <button type="submit" class="btn-primary" id="reset-btn">
          💾 حفظ كلمة المرور الجديدة
        </button>
      </form>

      <div class="auth-footer">
        <p><a href="login.html">⬅️ العودة لتسجيل الدخول</a></p>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ymzvhsrbmmmxxzqrmguz.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ggRH0XJFrm4FmkUAst7pvg_JX2vH4Vv';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const errorMsg = document.getElementById('error-msg');
      const successMsg = document.getElementById('success-msg');
      const btn = document.getElementById('reset-btn');

      errorMsg.classList.add('hidden');
      successMsg.classList.add('hidden');

      if (password !== confirmPassword) {
        errorMsg.textContent = '⚠️ كلمتا المرور غير متطابقتين';
        errorMsg.classList.remove('hidden');
        return;
      }

      if (password.length < 6) {
        errorMsg.textContent = '⚠️ كلمة المرور 6 أحرف على الأقل';
        errorMsg.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = '⏳ جارٍ الحفظ...';

      try {
        const { error } = await supabaseClient.auth.updateUser({
          password: password
        });

        if (error) throw error;

        successMsg.innerHTML = '✅ تم تغيير كلمة المرور بنجاح!<br><small>سيتم تحويلك لتسجيل الدخول...</small>';
        successMsg.classList.remove('hidden');

        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2500);

      } catch (err) {
        console.error('خطأ:', err);
        errorMsg.textContent = '⚠️ ' + (err.message || 'حدث خطأ. تأكدي من فتح الرابط من البريد.');
        errorMsg.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = '💾 حفظ كلمة المرور الجديدة';
      }
    });
  </script>
</body>
</html>
