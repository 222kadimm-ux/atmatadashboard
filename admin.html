<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإدارة - أتمتة</title>
  <link rel="stylesheet" href="admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function() {
      const admin = localStorage.getItem('atmata_admin');
      if (!admin) {
        window.location.href = 'admin-login.html';
      }
    })();
  </script>
</head>
<body>
  <div class="container">
    <header class="admin-header">
      <div>
        <h1>👑 لوحة الإدارة</h1>
        <p class="subtitle">إدارة منصة أتمتة</p>
      </div>
      <button id="logout-btn" class="btn-logout">🚪 خروج</button>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">🏪</div>
        <div class="stat-value" id="total-shops">0</div>
        <div class="stat-label">إجمالي المتاجر</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📦</div>
        <div class="stat-value" id="total-orders">0</div>
        <div class="stat-label">إجمالي الطلبات</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">💰</div>
        <div class="stat-value" id="total-revenue">0</div>
        <div class="stat-label">إجمالي المبيعات (د.ج)</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">👥</div>
        <div class="stat-value" id="total-users">0</div>
        <div class="stat-label">إجمالي المستخدمين</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="receipts">
        💳 الإيصالات
        <span id="receipts-count" class="badge-count" style="display:none;">0</span>
      </button>
      <button class="tab" data-tab="shops">🏪 المتاجر</button>
      <button class="tab" data-tab="orders">📦 الطلبات</button>
      <button class="tab" data-tab="users">👥 المستخدمون</button>
    </div>

    <div id="tab-receipts" class="tab-content active">
      <div id="receipts-list" class="data-list"></div>
    </div>

    <div id="tab-shops" class="tab-content hidden">
      <div id="shops-list" class="data-list"></div>
    </div>

    <div id="tab-orders" class="tab-content hidden">
      <div id="orders-list" class="data-list"></div>
    </div>

    <div id="tab-users" class="tab-content hidden">
      <div id="users-list" class="data-list"></div>
    </div>

    <footer>
      <p>© 2026 أتمتة - لوحة الإدارة</p>
    </footer>
  </div>

  <script src="admin.js"></script>
</body>
</html>
