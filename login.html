<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - أتمتة</title>
  <link rel="stylesheet" href="auth.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-header">
        <h1>📊 أتمتة</h1>
        <p>تسجيل الدخول للتجار</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">البريد الإلكتروني:</label>
          <input type="email" id="email" required placeholder="example@email.com">
        </div>

        <div class="form-group">
          <label for="password">كلمة المرور:</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>

        <div style="text-align:left; margin-bottom:15px;">
          <a href="forgot.html" style="color:#667eea; font-size:0.9em; text-decoration:none;">
            🔑 نسيت كلمة المرور؟
          </a>
        </div>

        <div id="error-msg" class="error-msg hidden"></div>
        <div id="success-msg" class="success-msg hidden"></div>

        <button type="submit" class="btn-primary" id="login-btn">
          🔐 تسجيل الدخول
        </button>
      </form>

      <div class="auth-footer">
        <p>ليس لديك حساب؟ <a href="register.html">سجل الآن</a></p>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
